x-ampq-url: &ampq-url amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
x-cron-schedule: &cron-schedule "0 * * * *"
x-fred-key: &fred_api ${FRED_API_KEY:-}
x-redis-url: &redis_url redis://redis:6379
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Ensure RabbitMQ doesn't go nuts
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  timescaledb:
    image: timescale/timescaledb:2.19.3-pg17
    container_name: timescaledb
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-market_signals}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U postgres -d market_signals -c 'SELECT 1 FROM public.assets LIMIT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  data-collector:
    build:
      context: .
      dockerfile: ./data-collector/data-collector.dockerfile
    container_name: data-collector
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      FRED_API_KEY: *fred_api
      CRON_SCHEDULE: *cron-schedule
      RABBITMQ_URL: *ampq-url
      HEALTH_HEAP_WARNING_MB: 512
      HEALTH_HEAP_CRITICAL_MB: 768
      MONITOR_CHECK_INTERVAL_CRON: "*/45 * * * *"
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OWLRACLE_API_KEY: ${OWLRACLE_API_KEY}

    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  signal-persister:
    build:
      context: .
      dockerfile: ./signal-persister/signal-persister.dockerfile
    container_name: signal-persister
    logging: *default-logging
    environment:
      RABBITMQ_URL: *ampq-url
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_HOST: timescaledb
      DB_NAME: ${POSTGRES_DB:-market_signals}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_PORT: "5432"
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  signal-query-api:
    build:
      context: .
      dockerfile: ./signal-query-api/signal-query-api.dockerfile
    container_name: signal-query-api
    logging: *default-logging
    ports:
      - "8080:3003"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-market_signals}
      PORT: 3003
      REDIS_URL: *redis_url
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  micro-frontend:
    build:
      context: .
      dockerfile: ./micro-frontend/micro-frontend.dockerfile
    container_name: micro-frontend
    logging: *default-logging
    ports:
      - "3001:80"
    depends_on:
      signal-query-api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
  scraper-service:
    build:
      context: .
      dockerfile: ./scraper-service/scraper-service.dockerfile
    container_name: scraper-service
    logging: *default-logging
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-market_signals}
      RABBITMQ_URL: *ampq-url
      CRON_SCHEDULE: *cron-schedule
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      sentiment-analysis-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Scraping can be memory intensive.
    mem_limit: 4gb
    # Playwright needs a large shared memory size to run Chromium.
    shm_size: "2gb"

  macro-event-extractor-service:
    build:
      context: .
      dockerfile: ./macro-event-extractor-service/macro-event-extractor-service.dockerfile
    container_name: macro-event-extractor-service
    logging: *default-logging
    environment:
      RABBITMQ_URL: *ampq-url
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-market_signals}
      EXTRACTION_MODEL: heuristic-extractor-v1
      EXTRACTION_VERSION: v1
      EMBEDDING_MODEL: embedding-stub-v1
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      scraper-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  macro-analyst-engine:
    build:
      context: .
      dockerfile: ./macro-analyst-engine/macro-analyst-engine.dockerfile
    container_name: macro-analyst-engine
    logging: *default-logging
    environment:
      RABBITMQ_URL: *ampq-url
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-market_signals}
      ANALYST_ANALOGUE_LIMIT: 8
      ANALYST_LOOKBACK_DAYS: 180
      ANALYST_POLICY_LOOKBACK_DAYS: 3650
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      macro-event-extractor-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  sentiment-analysis-service:
    build:
      context: .
      dockerfile: ./sentiment-analysis-service/sentiment-analysis.dockerfile
    container_name: sentiment-analysis-service
    logging: *default-logging
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY is required}
      - SENTIMENT_BATCH_INTERVAL_SECONDS=60
      - GROQ_MODEL=llama-3.3-70b-versatile
      - HEALTH_PORT=6220
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6220/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  seeder:
    build:
      context: .
      dockerfile: ./seeder/seeder.dockerfile
    container_name: seeder
    logging: *default-logging
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-market_signals}
      RABBITMQ_URL: *ampq-url
      FRED_API_KEY: *fred_api
      MACRO_HISTORY_START_DATE: "2008-01-01"
      GDELT_PUBLISH_TO_QUEUE: "false"
      GDELT_BACKFILL_WINDOW_HOURS: "24"
      GDELT_BACKFILL_MAX_RECORDS: "250"
      GDELT_BACKFILL_DELAY_MS: "1000"
    depends_on:
      timescaledb:
        condition: service_healthy
volumes:
  timescaledb_data:
